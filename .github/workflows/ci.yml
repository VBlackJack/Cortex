name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Weekly vulnerability scan of the locked trees, so new advisories surface
  # between releases. Only dependency-audit runs on this trigger.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrieval:
    name: Bilingual retrieval gate
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/retrieval.yml

  gate:
    name: Quality gate (Py${{ matrix.python-version }} / ${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install the locked project and dev tooling
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Run the same pre-commit gate as local (ruff, mypy strict, pytest)
        run: python -m pre_commit run --all-files --show-diff-on-failure

  # Rehearses the release build chain on every push, so a drift in the frozen
  # build, the license bundle, the portable archive or the wheel build fails
  # here instead of after a tag. The build commands are byte-identical to the
  # build and build-dist jobs of release.yml, and tests/test_ci_build_chain.py
  # keeps them so. Nothing is published: the installer is not compiled (it
  # needs the Companion, converter and model payloads), nothing is signed and
  # no artifact is uploaded.
  build-chain:
    name: Release build chain rehearsal (Windows)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      CPYTHON_LICENSE_URL: https://raw.githubusercontent.com/python/cpython/cbc944f4bc59639a444dd971c737788ba2283a91/LICENSE
      CPYTHON_LICENSE_SHA256: 78b12c3a81360b357002334f0e70ea0e92eebf7a9b358805c03c48484945f3bb
    strategy:
      matrix:
        include:
          - archive: cortex-windows-x64.zip
            binary: dist/cortex/cortex.exe
            binary_name: cortex.exe
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install the locked project and build tooling
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Materialize the pinned CPython runtime license
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          request = Request(
              os.environ["CPYTHON_LICENSE_URL"],
              headers={"Accept": "text/plain"},
          )
          with urlopen(request, timeout=30) as response:
              content = response.read()
          actual = hashlib.sha256(content).hexdigest()
          expected = os.environ["CPYTHON_LICENSE_SHA256"]
          if actual != expected:
              raise SystemExit(
                  f"CPython license SHA-256 mismatch: expected {expected}, got {actual}."
              )
          destination = Path(os.environ["RUNNER_TEMP"]) / "CPython-3.13.16-LICENSE.txt"
          destination.write_bytes(content)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"CORTEX_CPYTHON_LICENSE={destination}\n")
          PY

      - name: Build standalone executable
        shell: bash
        run: >-
          python packaging/build_executable.py --clean
          --python-license "${CORTEX_CPYTHON_LICENSE}"

      - name: Check the frozen executable reports the source version
        shell: bash
        env:
          CORTEX_BINARY: ${{ matrix.binary }}
        run: |
          expected="$(python -c 'from _version import __version__; print(__version__)' | tr -d '\r')"
          actual="$("${CORTEX_BINARY}" --version | tr -d '\r')"
          test -n "${expected}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Frozen executable reports ${actual}, _version.py holds ${expected}." >&2
            exit 1
          fi
          echo "Frozen executable reports ${actual}"

      - name: Stage the portable archive
        shell: bash
        run: |
          mkdir -p out
          python packaging/archive_portable.py \
            --binary "${{ matrix.binary }}" \
            --binary-name "${{ matrix.binary_name }}" \
            --licenses dist/licenses \
            --python-license "${CORTEX_CPYTHON_LICENSE}" \
            --output "out/${{ matrix.archive }}"

      - name: Build distributions
        run: python -m build --wheel --no-isolation

      # The frozen build leaves dist/cortex and dist/licenses beside the wheel.
      - name: Check distribution metadata
        run: python -m twine check dist/*.whl

      # Same smoke as release.yml build-dist, with the Windows venv layout.
      - name: Smoke-test installed wheel
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "${wheel}"
          python -m venv wheel-smoke
          wheel-smoke/Scripts/python -m pip install --require-hashes -r requirements.lock
          wheel-smoke/Scripts/python -m pip install --no-deps "${wheel}"
          wheel-smoke/Scripts/cortex --version
          wheel-smoke/Scripts/cortex --help

  dependency-audit:
    name: Dependency vulnerability scan (Py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install the locked audit toolchain
        run: python -m pip install --require-hashes -r requirements-dev.lock

      # PYSEC-2026-311 (CVE-2026-45829): pre-auth RCE in the ChromaDB HTTP
      # server via the REST API with trust_remote_code=true. Not applicable to
      # Cortex, which uses the embedded PersistentClient only (no server, no
      # REST endpoint) with a fixed local ONNX model via fastembed (the
      # trust_remote_code path is never reached). No fixed chromadb release
      # exists yet; remove this ignore once one ships and the pin is bumped.
      #
      # CVE-2026-45833 is a second code injection reached through that same
      # HTTP server API. CVE-2026-45830 lets an authenticated user read and
      # write another tenant's collections, and CVE-2026-45831 leaves
      # SimpleRBACAuthorizationProvider permissions unscoped. All three need the
      # server, its tenants, or its authorization provider, none of which the
      # embedded PersistentClient instantiates. Chromadb 1.5.9 carries the same
      # advisories, so no upgrade closes them; remove these ignores once a fixed
      # release ships and the pin is bumped.
      #
      # CVE-2026-112395, CVE-2026-112397, CVE-2026-112400, CVE-2026-112404,
      # CVE-2026-112895, CVE-2026-112896, CVE-2026-112897 and CVE-2026-112899
      # all sit in Pillow image decoders and writers (TIFF, GIF, PPM, EPS and
      # PDF append). The three locks pin pillow 12.3.0 because fastembed 0.8.0
      # caps pillow<13, and fastembed is frozen: its version is part of the
      # embedding fingerprint, so a bump would invalidate every existing index.
      # Cortex never imports PIL and only calls pdfplumber extract_text, which
      # reads the text layer and never decodes an embedded image. Remove these
      # ignores when fastembed accepts Pillow 13 and the pin is bumped.
      #
      # Scan every fully-pinned, hash-locked environment used to build or ship
      # Cortex so the runtime, release toolchain, and model fetcher are covered.
      - name: Audit every locked dependency tree for known CVEs
        run: |
          python -m pip_audit -r requirements.lock \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833 \
            --ignore-vuln CVE-2026-112395 \
            --ignore-vuln CVE-2026-112397 \
            --ignore-vuln CVE-2026-112400 \
            --ignore-vuln CVE-2026-112404 \
            --ignore-vuln CVE-2026-112895 \
            --ignore-vuln CVE-2026-112896 \
            --ignore-vuln CVE-2026-112897 \
            --ignore-vuln CVE-2026-112899
          python -m pip_audit -r requirements-dev.lock \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833 \
            --ignore-vuln CVE-2026-112395 \
            --ignore-vuln CVE-2026-112397 \
            --ignore-vuln CVE-2026-112400 \
            --ignore-vuln CVE-2026-112404 \
            --ignore-vuln CVE-2026-112895 \
            --ignore-vuln CVE-2026-112896 \
            --ignore-vuln CVE-2026-112897 \
            --ignore-vuln CVE-2026-112899
          python -m pip_audit -r requirements-model.lock \
            --ignore-vuln CVE-2026-112395 \
            --ignore-vuln CVE-2026-112397 \
            --ignore-vuln CVE-2026-112400 \
            --ignore-vuln CVE-2026-112404 \
            --ignore-vuln CVE-2026-112895 \
            --ignore-vuln CVE-2026-112896 \
            --ignore-vuln CVE-2026-112897 \
            --ignore-vuln CVE-2026-112899
