name: ci

on:
  push:
    branches: [main, "claude-code/**", "codex/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Quality gate (Py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project with dev tooling
        run: python -m pip install -e ".[dev]"

      - name: Run the same pre-commit gate as local (ruff, mypy strict, pytest)
        run: python -m pre_commit run --all-files --show-diff-on-failure

  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      # PYSEC-2026-311 (CVE-2026-45829): pre-auth RCE in the ChromaDB HTTP
      # server via the REST API with trust_remote_code=true. Not applicable to
      # Cortex, which uses the embedded PersistentClient only (no server, no
      # REST endpoint) with a fixed local ONNX model via fastembed (the
      # trust_remote_code path is never reached). No fixed chromadb release
      # exists yet; remove this ignore once one ships and the pin is bumped.
      #
      # Scans the fully-pinned, hash-locked transitive tree (requirements.lock)
      # rather than the direct pins alone, so transitive CVEs are caught too.
      - name: Audit the locked transitive dependency tree for known CVEs
        run: python -m pip_audit -r requirements.lock --ignore-vuln PYSEC-2026-311
