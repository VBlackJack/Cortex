name: ci

on:
  push:
    branches: [main, "claude-code/**", "codex/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Quality gate (Py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install the locked project and dev tooling
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Run the same pre-commit gate as local (ruff, mypy strict, pytest)
        run: python -m pre_commit run --all-files --show-diff-on-failure

  dependency-audit:
    name: Dependency vulnerability scan (Py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install the locked audit toolchain
        run: python -m pip install --require-hashes -r requirements-dev.lock

      # PYSEC-2026-311 (CVE-2026-45829): pre-auth RCE in the ChromaDB HTTP
      # server via the REST API with trust_remote_code=true. Not applicable to
      # Cortex, which uses the embedded PersistentClient only (no server, no
      # REST endpoint) with a fixed local ONNX model via fastembed (the
      # trust_remote_code path is never reached). No fixed chromadb release
      # exists yet; remove this ignore once one ships and the pin is bumped.
      #
      # CVE-2026-45833 is a second code injection reached through that same
      # HTTP server API. CVE-2026-45830 lets an authenticated user read and
      # write another tenant's collections, and CVE-2026-45831 leaves
      # SimpleRBACAuthorizationProvider permissions unscoped. All three need the
      # server, its tenants, or its authorization provider, none of which the
      # embedded PersistentClient instantiates. Chromadb 1.5.9 carries the same
      # advisories, so no upgrade closes them; remove these ignores once a fixed
      # release ships and the pin is bumped.
      #
      # Scan every fully-pinned, hash-locked environment used to build or ship
      # Cortex so the runtime, release toolchain, and model fetcher are covered.
      - name: Audit every locked dependency tree for known CVEs
        run: |
          python -m pip_audit -r requirements.lock \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833
          python -m pip_audit -r requirements-dev.lock \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833
          python -m pip_audit -r requirements-model.lock
