name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MCP_SERVER_JSON_PATH: server.json
  MCP_SERVER_NAME: io.github.VBlackJack/cortex
  PYPI_PACKAGE: cortex-local-rag
  PYPI_API_BASE_URL: https://pypi.org/pypi
  MCP_REGISTRY_API_BASE_URL: https://registry.modelcontextprotocol.io
  MCP_PUBLISHER_DOWNLOAD_BASE_URL: https://github.com/modelcontextprotocol/registry/releases/download
  MCP_PUBLISHER_VERSION: v1.8.1
  MCP_PUBLISHER_ASSET: mcp-publisher_linux_amd64.tar.gz
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
  MCP_PYPI_POLL_ATTEMPTS: "12"
  MCP_PYPI_POLL_INTERVAL_SECONDS: "10"
  MCP_CURL_CONNECT_TIMEOUT_SECONDS: "10"
  MCP_CURL_MAX_TIME_SECONDS: "30"
  MCP_DOWNLOAD_MAX_TIME_SECONDS: "120"
  CPYTHON_LICENSE_URL: https://raw.githubusercontent.com/python/cpython/3bb231a6a5dc02b95658877318bf61501a7209e9/LICENSE
  CPYTHON_LICENSE_SHA256: 3b2f81fe21d181c499c59a256c8e1968455d6689d269aa85373bfb6af41da3bf

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install the locked verification environment
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Verify the tag matches the single version source
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          source_version="$(python -c 'from _version import __version__; print(__version__)')"
          test "${GITHUB_REF_NAME}" = "v${source_version}"
          python - <<'PY'
          import json
          from pathlib import Path

          from packaging.version import Version

          from _version import __version__

          descriptor = json.loads(Path("server.json").read_text(encoding="utf-8"))
          expected = str(Version(__version__))
          assert descriptor["version"] == expected
          packages = descriptor["packages"]
          assert len(packages) == 1
          assert packages[0]["version"] == expected
          assert packages[0]["identifier"] == "cortex-local-rag"
          PY

      - name: Run release gates
        run: |
          python -m ruff check .
          python -m mypy
          python -m pytest tests/ -q
          python -m pip_audit -r requirements.lock --ignore-vuln PYSEC-2026-311
          python -m pip_audit -r requirements-dev.lock --ignore-vuln PYSEC-2026-311
          python -m pip_audit -r requirements-model.lock
          bash -n scripts/build_installer.sh

  build:
    name: Build executable (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: cortex-windows-x64-portable
            archive: cortex-windows-x64.zip
            binary: dist/cortex.exe
            binary_name: cortex.exe
            expected_machine: AMD64
          - os: macos-latest
            artifact: cortex-macos-arm64-portable
            archive: cortex-macos-arm64.zip
            binary: dist/cortex
            binary_name: cortex
            expected_machine: arm64
          - os: ubuntu-latest
            artifact: cortex-linux-x64-portable
            archive: cortex-linux-x64.zip
            binary: dist/cortex
            binary_name: cortex
            expected_machine: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Checkout matching Cortex Companion source
        if: runner.os == 'Windows'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          repository: VBlackJack/CortexCompanion
          ref: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          path: companion-source

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Verify runner architecture matches the release asset name
        shell: bash
        env:
          EXPECTED_MACHINE: ${{ matrix.expected_machine }}
        run: |
          python - <<'PY'
          import os
          import platform

          actual = platform.machine()
          expected = os.environ["EXPECTED_MACHINE"]
          if actual.casefold() != expected.casefold():
              raise SystemExit(
                  f"Runner architecture mismatch: expected {expected!r}, got {actual!r}."
              )
          print(f"Verified release runner architecture: {actual}")
          PY

      - name: Install the locked project and build tooling
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Materialize the pinned CPython runtime license
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          request = Request(
              os.environ["CPYTHON_LICENSE_URL"],
              headers={"Accept": "text/plain"},
          )
          with urlopen(request, timeout=30) as response:
              content = response.read()
          actual = hashlib.sha256(content).hexdigest()
          expected = os.environ["CPYTHON_LICENSE_SHA256"]
          if actual != expected:
              raise SystemExit(
                  f"CPython license SHA-256 mismatch: expected {expected}, got {actual}."
              )
          destination = Path(os.environ["RUNNER_TEMP"]) / "CPython-3.12.13-LICENSE.txt"
          destination.write_bytes(content)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"CORTEX_CPYTHON_LICENSE={destination}\n")
          PY

      - name: Build standalone executable
        shell: bash
        run: >-
          python packaging/build_executable.py --clean
          --python-license "${CORTEX_CPYTHON_LICENSE}"

      - name: Set up .NET 10
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5
        with:
          dotnet-version: "10.0.x"

      - name: Verify matching Cortex Companion source
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: companion-source
        run: |
          & dotnet restore CortexCompanion.sln --locked-mode
          if ($LASTEXITCODE -ne 0) {
            throw "Cortex Companion restore failed with exit code $LASTEXITCODE."
          }
          & dotnet format CortexCompanion.sln --no-restore --verify-no-changes
          if ($LASTEXITCODE -ne 0) {
            throw "Cortex Companion format gate failed with exit code $LASTEXITCODE."
          }
          & .\tools\ci-csharp-style.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Cortex Companion style gate failed with exit code $LASTEXITCODE."
          }
          & dotnet build CortexCompanion.sln `
            --configuration Release `
            --no-restore `
            -warnaserror
          if ($LASTEXITCODE -ne 0) {
            throw "Cortex Companion build failed with exit code $LASTEXITCODE."
          }
          & dotnet test CortexCompanion.sln `
            --configuration Release `
            --no-build `
            --no-restore
          if ($LASTEXITCODE -ne 0) {
            throw "Cortex Companion tests failed with exit code $LASTEXITCODE."
          }

      - name: Publish matching self-contained Cortex Companion
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Get-CompanionVersion {
            param([Parameter(Mandatory = $true)][string]$ExecutablePath)

            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $ExecutablePath
            [void]$startInfo.ArgumentList.Add("--version")
            $startInfo.UseShellExecute = $false
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            $startInfo.CreateNoWindow = $true
            $process = [System.Diagnostics.Process]::new()
            $process.StartInfo = $startInfo
            try {
              if (-not $process.Start()) {
                throw "Cortex Companion version process did not start."
              }
              $standardOutput = $process.StandardOutput.ReadToEnd()
              $standardError = $process.StandardError.ReadToEnd()
              $process.WaitForExit()
              if ($process.ExitCode -ne 0) {
                throw (
                  "Cortex Companion --version failed with exit code " +
                  "$($process.ExitCode): $($standardError.Trim())"
                )
              }
              return $standardOutput.Trim()
            }
            finally {
              $process.Dispose()
            }
          }

          $project = "companion-source\src\CortexCompanion\CortexCompanion.csproj"
          & dotnet publish $project `
            --configuration Release `
            --no-restore `
            -p:PublishProfile=win-x64 `
            --output dist-companion
          if ($LASTEXITCODE -ne 0) {
            throw "Cortex Companion publish failed with exit code $LASTEXITCODE."
          }
          $version = (& python -c "from _version import __version__; print(__version__)").Trim()
          $companionVersion = Get-CompanionVersion `
            -ExecutablePath ".\dist-companion\CortexCompanion.exe"
          if ($companionVersion -cne $version) {
            throw "Cortex Companion version mismatch: expected '$version', got '$companionVersion'."
          }

      - name: Smoke-test CLI and server imports
        shell: bash
        env:
          CORTEX_BINARY: ${{ matrix.binary }}
          CORTEX_KB_PATH: ${{ github.workspace }}
        run: |
          "${CORTEX_BINARY}" --version
          "${CORTEX_BINARY}" --help
          "${CORTEX_BINARY}" check --clients none
          python - <<'PY'
          import os
          import subprocess
          import time

          binary = os.environ["CORTEX_BINARY"]
          process = subprocess.Popen(
              [binary, "serve"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )
          try:
              # Pass criterion: the server survives 8s without crashing on the
              # ML-stack import. A stdio MCP server is not required to exit on
              # stdin EOF, so shutdown below is best-effort and never fails.
              time.sleep(8)
              if process.poll() is not None:
                  stdout, stderr = process.communicate()
                  raise SystemExit(
                      f"cortex serve exited early ({process.returncode})\n"
                      f"stdout:\n{stdout}\nstderr:\n{stderr}"
                  )
              print("cortex serve stayed alive for 8s; ML stack imported cleanly")
          finally:
              if process.stdin is not None:
                  try:
                      process.stdin.close()
                  except OSError:
                      pass
              if process.poll() is None:
                  process.terminate()
                  try:
                      process.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait(timeout=5)
          PY

      - name: Sign Windows executable when a certificate is configured
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PFX_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)
          if (-not $hasCertificate -and -not $hasPassword) {
            Write-Output "Windows signing certificate is not configured; continuing unsigned."
            exit 0
          }
          if (-not $hasCertificate -or -not $hasPassword) {
            throw "Both Windows signing secrets must be configured together."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "cortex-windows-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64)
          )
          $signTool = Get-ChildItem (
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe"
          ) | Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signTool) {
            throw "signtool.exe was not found on the Windows runner."
          }
          & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com `
            /td SHA256 /f $certificatePath /p $env:WINDOWS_CERT_PASSWORD dist\cortex.exe
          if ($LASTEXITCODE -ne 0) {
            throw "Signing cortex.exe failed with exit code $LASTEXITCODE."
          }

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Prepare verified embedded model payload
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hubVersion = & python -c `
            'import json; print(json.load(open("models.lock"))["huggingface_hub_version"])'
          $hubVersion = $hubVersion.Trim()
          $modelToolVenv = Join-Path $env:RUNNER_TEMP "cortex-model-tools"
          & python -m venv $modelToolVenv
          if ($LASTEXITCODE -ne 0) {
            throw "Creating the isolated model-tool environment failed."
          }
          $modelToolPython = Join-Path $modelToolVenv "Scripts\python.exe"
          & $modelToolPython -m pip install `
            --require-hashes `
            -r requirements-model.lock
          if ($LASTEXITCODE -ne 0) {
            throw "Installing the locked model toolchain failed with exit code $LASTEXITCODE."
          }
          $installedHubVersion = (& $modelToolPython -c `
            'import importlib.metadata; print(importlib.metadata.version("huggingface-hub"))'
          ).Trim()
          if ($installedHubVersion -cne $hubVersion) {
            throw (
              "Model toolchain mismatch: models.lock requires '$hubVersion', " +
              "requirements-model.lock installed '$installedHubVersion'."
            )
          }
          $payload = Join-Path $env:RUNNER_TEMP "cortex-model-payload"
          & $modelToolPython scripts/model_payload.py prepare --output $payload
          if ($LASTEXITCODE -ne 0) {
            throw "Preparing the verified model payload failed with exit code $LASTEXITCODE."
          }
          "CORTEX_MODEL_PAYLOAD_DIR=$payload" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (& python -c "from _version import __version__; print(__version__)").Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "ISCC.exe was not installed at the expected path."
          }
          & python packaging\windows\build_installer.py `
            --app-version $version `
            --companion-payload-dir dist-companion `
            --model-payload-dir $env:CORTEX_MODEL_PAYLOAD_DIR `
            --iscc $iscc
          if ($LASTEXITCODE -ne 0) {
            throw "Windows installer build failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path -LiteralPath dist-installer\Cortex-Setup.exe)) {
            throw "Inno Setup reported success but Cortex-Setup.exe is missing."
          }
          $installer = Get-Item -LiteralPath dist-installer\Cortex-Setup.exe
          $payloadBytes = (
            Get-ChildItem -LiteralPath $env:CORTEX_MODEL_PAYLOAD_DIR -File -Recurse |
              Measure-Object -Property Length -Sum
          ).Sum
          $installerMiB = [math]::Round($installer.Length / 1MB, 2)
          $payloadMiB = [math]::Round($payloadBytes / 1MB, 2)
          Write-Output "Embedded model payload: $payloadBytes bytes ($payloadMiB MiB)."
          Write-Output "Compressed Cortex-Setup.exe: $($installer.Length) bytes ($installerMiB MiB)."
          @"
          ### Windows installer size

          - Verified model payload: $payloadBytes bytes ($payloadMiB MiB)
          - Compressed Cortex-Setup.exe: $($installer.Length) bytes ($installerMiB MiB)
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Smoke-test installed models with Hugging Face offline
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          $localDataRoot = [IO.Path]::GetFullPath($env:LOCALAPPDATA)
          $modelRoot = [IO.Path]::GetFullPath(
            (Join-Path $localDataRoot "Cortex\models")
          )
          $expectedModelRoot = Join-Path $localDataRoot "Cortex\models"
          if ($modelRoot -ne $expectedModelRoot) {
            throw "Refusing to clean unexpected model cache path: $modelRoot"
          }
          if (Test-Path -LiteralPath $modelRoot) {
            Remove-Item -LiteralPath $modelRoot -Recurse -Force
          }
          if (Test-Path -LiteralPath $modelRoot) {
            throw "Failed to clean per-user model cache before installation: $modelRoot"
          }
          $knowledgeBase = Join-Path $env:RUNNER_TEMP "cortex-offline-kb"
          New-Item -ItemType Directory -Path $knowledgeBase | Out-Null
          $document = Join-Path $knowledgeBase "offline-installer-smoke.md"
          $content = (
            "Cortex offline installer smoke document. " * 20
          ) + "The embedded embedding and reranker models must load without network access."
          Set-Content -LiteralPath $document -Value $content -Encoding utf8

          $installerLog = Join-Path $env:RUNNER_TEMP "cortex-offline-install.log"
          $installerArguments = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/INDEX",
            "/KBPATH=`"$knowledgeBase`"",
            "/INDEXMODE=whole",
            "/LOG=`"$installerLog`""
          )
          $installProcess = Start-Process `
            -FilePath "dist-installer\Cortex-Setup.exe" `
            -ArgumentList $installerArguments `
            -Wait -PassThru -WindowStyle Hidden
          if ($installProcess.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $installerLog -PathType Leaf) {
              Get-Content -LiteralPath $installerLog
            }
            throw "Offline installer smoke failed with exit code $($installProcess.ExitCode)."
          }
          $installed = Join-Path $env:LOCALAPPDATA "Programs\Cortex\cortex.exe"
          $installedRoot = Join-Path $env:LOCALAPPDATA "Programs\Cortex"
          $installedCompanion = Join-Path `
            $env:LOCALAPPDATA `
            "Programs\Cortex\Companion\CortexCompanion.exe"
          $installedLicenseRoot = Join-Path $installedRoot "licenses"
          $installedCompanionRoot = Join-Path $installedRoot "Companion"
          foreach ($required in @(
            $installed,
            $installedCompanion,
            (Join-Path $installedLicenseRoot "Cortex-LICENSE.txt"),
            (Join-Path $installedLicenseRoot "PYTHON_LICENSE.txt"),
            (Join-Path $installedLicenseRoot "THIRD_PARTY_LICENSES.json"),
            (Join-Path $installedLicenseRoot "SHA256SUMS"),
            (Join-Path $installedCompanionRoot "CortexCompanion-LICENSE.txt"),
            (Join-Path $installedCompanionRoot "LICENSE.txt"),
            (Join-Path $installedCompanionRoot "ThirdPartyNotices.txt"),
            (Join-Path $installedCompanionRoot "WPF-LICENSE.txt"),
            (Join-Path $installedCompanionRoot "WPF-ThirdPartyNotices.txt"),
            (Join-Path $installedCompanionRoot "Tomlyn-LICENSE.txt"),
            (Join-Path $modelRoot "manifest.json"),
            (Join-Path $modelRoot "licenses\Apache-2.0.txt"),
            (Join-Path $modelRoot "licenses\THIRD_PARTY_NOTICES.md")
          )) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Offline installer did not install required file: $required"
            }
          }
          & python packaging\license_bundle.py `
            --verify-only `
            --python-license $env:CORTEX_CPYTHON_LICENSE `
            --output-dir $installedLicenseRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Installed redistribution license bundle verification failed."
          }
          $installedVersion = (& $installed --version).Trim()
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $installedCompanion
          [void]$startInfo.ArgumentList.Add("--version")
          $startInfo.UseShellExecute = $false
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          $startInfo.CreateNoWindow = $true
          $versionProcess = [System.Diagnostics.Process]::new()
          $versionProcess.StartInfo = $startInfo
          try {
            if (-not $versionProcess.Start()) {
              throw "Installed Cortex Companion version process did not start."
            }
            $companionStandardOutput = $versionProcess.StandardOutput.ReadToEnd()
            $companionStandardError = $versionProcess.StandardError.ReadToEnd()
            $versionProcess.WaitForExit()
            if ($versionProcess.ExitCode -ne 0) {
              throw (
                "Installed Cortex Companion --version failed with exit code " +
                "$($versionProcess.ExitCode): $($companionStandardError.Trim())"
              )
            }
            $installedCompanionVersion = $companionStandardOutput.Trim()
          }
          finally {
            $versionProcess.Dispose()
          }
          if ($installedVersion -cne $installedCompanionVersion) {
            throw (
              "Installed payload version mismatch: CLI '$installedVersion', " +
              "Companion '$installedCompanionVersion'."
            )
          }
          $searchOutput = & $installed sync --search "offline installer smoke" 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "Installed Cortex search failed with exit code $LASTEXITCODE."
          }
          $searchText = $searchOutput | Out-String
          Write-Output $searchText
          if ($searchText -notmatch "offline-installer-smoke") {
            throw "Installed Cortex search did not return the offline smoke document."
          }
          Write-Output "Offline installer embedding and reranker smoke passed."

      - name: Sign Windows installer when a certificate is configured
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "cortex-windows-signing.pfx"
          if (-not (Test-Path -LiteralPath $certificatePath)) {
            Write-Output "Windows signing certificate is not configured; continuing unsigned."
            exit 0
          }
          try {
            $signTool = Get-ChildItem (
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe"
            ) | Sort-Object FullName -Descending | Select-Object -First 1
            if ($null -eq $signTool) {
              throw "signtool.exe was not found on the Windows runner."
            }
            & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com `
              /td SHA256 /f $certificatePath /p $env:WINDOWS_CERT_PASSWORD `
              dist-installer\Cortex-Setup.exe
            if ($LASTEXITCODE -ne 0) {
              throw "Signing Cortex-Setup.exe failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p out
          python packaging/archive_portable.py \
            --binary "${{ matrix.binary }}" \
            --binary-name "${{ matrix.binary_name }}" \
            --licenses dist/licenses \
            --python-license "${CORTEX_CPYTHON_LICENSE}" \
            --output "out/${{ matrix.archive }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "dist-installer/Cortex-Setup.exe" "out/Cortex-Setup.exe"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: ${{ matrix.artifact }}
          path: out/
          if-no-files-found: error
          retention-days: 1

  build-dist:
    name: Build Python distributions
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-metadata.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install the locked build toolchain
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Set reproducible release metadata
        id: release-metadata
        shell: bash
        run: |
          version="$(python -c 'from packaging.version import Version; from _version import __version__; print(Version(__version__))')"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          test -n "${version}"
          test "${source_date_epoch}" -gt 0
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "SOURCE_DATE_EPOCH=${source_date_epoch}" >> "${GITHUB_ENV}"

      - name: Build distributions
        run: python -m build --wheel --no-isolation

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test installed wheel
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "${wheel}"
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install --require-hashes -r requirements.lock
          wheel-smoke/bin/python -m pip install --no-deps "${wheel}"
          wheel-smoke/bin/cortex --version
          wheel-smoke/bin/cortex --help

      - name: Validate registry publisher script
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck scripts/mcp_registry_publish.sh
          bash scripts/mcp_registry_publish.sh --validate-only

      - name: Upload distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build-dist
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: pypi-distributions
          path: dist

      - name: Verify exact PyPI publication state
        id: pypi-state
        env:
          RELEASE_VERSION: ${{ needs.build-dist.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          package = os.environ["PYPI_PACKAGE"]
          version = os.environ["RELEASE_VERSION"]
          base_url = os.environ["PYPI_API_BASE_URL"].rstrip("/")
          request = Request(
              f"{base_url}/{package}/{version}/json",
              headers={"Accept": "application/json"},
          )
          published: dict[str, str] | None
          try:
              with urlopen(request, timeout=30) as response:
                  payload = json.load(response)
          except HTTPError as error:
              if error.code != 404:
                  raise
              published = None
          else:
              if payload.get("info", {}).get("version") != version:
                  raise SystemExit("PyPI returned an unexpected release version.")
              published = {
                  item["filename"]: item["digests"]["sha256"]
                  for item in payload.get("urls", [])
              }
              if not published:
                  raise SystemExit("PyPI returned a release without distribution files.")

          local = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in sorted(Path("dist").iterdir())
              if path.is_file()
          }
          if not local:
              raise SystemExit("No local distributions were downloaded.")
          if published is not None and published != local:
              raise SystemExit(
                  "PyPI already has this version with different files or SHA-256 digests."
              )

          exists = "true" if published is not None else "false"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"exists={exists}\n")
          PY

      - name: Publish distributions
        if: steps.pypi-state.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          packages-dir: dist/

  publish-mcp-registry:
    name: Publish server metadata to the MCP Registry
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Publish committed server metadata after PyPI
        run: bash scripts/mcp_registry_publish.sh

  release:
    name: Attach binaries to the GitHub Release
    needs: [build-dist, publish-mcp-registry]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Verify exact release asset set
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.build-dist.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          expected = {
              "Cortex-Setup.exe",
              "cortex-linux-x64.zip",
              "cortex-macos-arm64.zip",
              "cortex-windows-x64.zip",
              f"cortex_local_rag-{os.environ['RELEASE_VERSION']}-py3-none-any.whl",
          }
          root = Path("dist-artifacts")
          actual = {path.name for path in root.iterdir() if path.is_file()}
          non_files = sorted(path.name for path in root.iterdir() if not path.is_file())
          if actual != expected or non_files:
              raise SystemExit(
                  f"Release asset set mismatch: expected={sorted(expected)}, "
                  f"actual={sorted(actual)}, non_files={non_files}"
              )
          print(f"Verified exact release asset set: {sorted(actual)}")
          PY

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          (
            cd dist-artifacts
            find . -type f -print0 | sort -z | xargs -0 -r sha256sum
          ) | sed 's#  \./#  #' > SHA256SUMS
          test -s SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a  # v3
        with:
          subject-path: 'dist-artifacts/**/*'

      - name: Publish release with binaries
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3
        with:
          files: |
            dist-artifacts/**/*
            SHA256SUMS
          generate_release_notes: true
