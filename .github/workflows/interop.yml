name: interoperability

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      peer_ref:
        description: "Revision of CortexCompanion to verify against"
        default: main
        type: string

permissions:
  contents: read

jobs:
  contracts:
    runs-on: windows-latest
    steps:
      - name: Checkout this revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: Cortex
      - name: Checkout the peer contract
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: VBlackJack/CortexCompanion
          ref: ${{ inputs.peer_ref || 'main' }}
          path: CortexCompanion
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.x
      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r Cortex/requirements.lock
      - name: Verify the documented Companion labels
        working-directory: Cortex
        run: python scripts/sync_companion_labels.py --check --companion ../CortexCompanion
      - name: Restore locked Companion dependencies
        run: dotnet restore CortexCompanion/CortexCompanion.sln --locked-mode
      - name: Build the cross-process probe
        run: dotnet build CortexCompanion/tests/CortexCompanion.LockProbe/CortexCompanion.LockProbe.csproj --no-restore
      - name: Verify the shared byte lock
        working-directory: CortexCompanion
        run: python tests/interop/lock_interop_proof.py
      - name: Verify canonical TOML bytes
        working-directory: CortexCompanion
        run: python tests/interop/renderer_differential_proof.py
      - name: Verify the desktop search contract
        working-directory: CortexCompanion
        run: python tests/interop/search_contract_proof.py
