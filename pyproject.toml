[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex"
dynamic = ["version", "dependencies"]
description = "Local multi-client RAG server over the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Julien Bombled" }]

[project.optional-dependencies]
dev = [
  "mypy==2.2.0",
  "pre-commit==4.6.0",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.21",
]
build = [
  "pyinstaller>=6.0",
]

[project.scripts]
cortex = "cli:main"

[tool.setuptools]
py-modules = [
  "_version",
  "chroma_client",
  "chunker",
  "chunker_pdf",
  "chunker_utils",
  "cli",
  "config",
  "cortex_logging",
  "data_home",
  "dependencies",
  "doctor",
  "embedding_fingerprint",
  "freshness",
  "indexer",
  "lexical_index",
  "offline_models",
  "reranker",
  "server",
  "setup_config",
  "sync_hash_aware",
  "sync_summary",
  "user_config",
  "write_lock",
]
license-files = ["LICENSE"]

[tool.setuptools.dynamic]
version = { attr = "_version.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
target-version = "py310"
line-length = 99
extend-exclude = ["local"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "BLE001", "S110"]

[tool.mypy]
python_version = "3.10"
strict = true
no_site_packages = true
files = ["*.py", "scripts", "eval"]
exclude = ["^tests/", "^local/"]

[[tool.mypy.overrides]]
module = [
  "chromadb.*",
  "fastembed.*",
  "filelock.*",
  "mcp.*",
  "pdfplumber.*",
  "tomli",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "server"
disable_error_code = ["untyped-decorator"]

[[tool.mypy.overrides]]
module = "indexer"
disable_error_code = ["misc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
