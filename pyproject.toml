[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-local-rag"
dynamic = ["version", "dependencies"]
description = "Local multi-client RAG server over the Model Context Protocol"
readme = { file = "README.en.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Julien Bombled" }]
keywords = ["mcp", "rag", "semantic-search", "local-first", "chromadb"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Indexing",
]

[project.urls]
Homepage = "https://github.com/VBlackJack/Cortex"
Documentation = "https://github.com/VBlackJack/Cortex/tree/main/docs/en"
Repository = "https://github.com/VBlackJack/Cortex"
Issues = "https://github.com/VBlackJack/Cortex/issues"
Changelog = "https://github.com/VBlackJack/Cortex/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "mypy==2.2.0",
  "pip-audit==2.10.1",
  "pre-commit==4.6.0",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.21",
]
build = [
  "build==1.5.0",
  "pyinstaller==6.21.0",
  "twine==7.0.0",
  "wheel==0.47.0",
]

[project.scripts]
cortex = "cli:main"
cortex-local-rag = "cli:main"

[tool.setuptools]
packages = ["confluence_writer", "confluence_writer.resources", "ingestion"]
py-modules = [
  "_version",
  "bundle_command",
  "bundle_contract",
  "bundle_format",
  "chroma_client",
  "chunker",
  "chunker_pdf",
  "chunker_utils",
  "cli",
  "config",
  "config_command",
  "config_contract",
  "cortex_logging",
  "data_home",
  "dependencies",
  "doctor",
  "embedding_fingerprint",
  "freshness",
  "index_contract",
  "indexer",
  "lexical_index",
  "offline_models",
  "reranker",
  "server",
  "setup_config",
  "setup_wizard",
  "sync_contract",
  "sync_hash_aware",
  "sync_summary",
  "user_config",
  "user_config_mutation",
  "write_lock",
]
[tool.setuptools.package-data]
"confluence_writer.resources" = ["*.schema.json"]

[tool.setuptools.dynamic]
version = { attr = "_version.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
target-version = "py310"
line-length = 99
extend-exclude = ["local"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "BLE001", "S110"]

[tool.mypy]
python_version = "3.10"
strict = true
no_site_packages = true
files = [
    "*.py",
    "ingestion",
    "scripts",
    "eval",
    "packaging/archive_portable.py",
    "packaging/build_executable.py",
    "packaging/license_bundle.py",
    "packaging/windows/build_installer.py",
]
exclude = ["^tests/", "^local/"]

[[tool.mypy.overrides]]
module = [
  "chromadb.*",
  "cryptography.*",
  "fastembed.*",
  "filelock.*",
  "huggingface_hub.*",
  "jsonschema.*",
  "mcp.*",
  "pdfplumber.*",
  "pydantic.*",
  "setuptools",
  "setuptools.*",
  "tomli",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "server"
disable_error_code = ["untyped-decorator"]

[[tool.mypy.overrides]]
module = "indexer"
disable_error_code = ["misc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Same notice indexer.py filters at runtime; pytest resets the filters.
filterwarnings = ["ignore:.*mean pooling.*:UserWarning"]
