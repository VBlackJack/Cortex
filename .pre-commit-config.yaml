repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: python -m ruff check .
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy
        name: mypy strict
        entry: python -m mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest full suite
        entry: python -m pytest tests/ -q
        language: system
        pass_filenames: false
        types: [python]
